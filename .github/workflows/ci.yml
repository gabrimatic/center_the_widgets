name: CI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci.yml"
      - ".gitignore"
      - ".pubignore"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "lib/**"
      - "test/**"
      - "example/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".gitignore"
      - ".pubignore"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "lib/**"
      - "test/**"
      - "example/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate package publish
        run: flutter pub publish --dry-run

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze
